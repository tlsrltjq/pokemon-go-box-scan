name: Check starter

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: brew install ffmpeg
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: cmp AGENTS.md CLAUDE.md
