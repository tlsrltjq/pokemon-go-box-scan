<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 박스 · 포켓몬 GO 박스 스캔</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/common.js" defer></script>
  <script src="/assets/box.js" defer></script>
</head>
<body>
  <div class="appbar"><div class="appbar-inner"><a class="brand" href="/">포켓몬 GO 박스 스캔</a>
    <nav aria-label="주요 화면"><a href="/">스캔</a><a href="/box" aria-current="page">내 박스</a><a href="/raid">레이드 추천</a><a href="/max">맥스배틀 추천</a></nav>
  </div></div>
  <main class="wide">
    <header class="page-head">
      <h1>내 박스</h1>
      <p>승인해 저장한 개체입니다. 갱신할 때마다 이전 값이 이력에 남습니다.</p>
    </header>
    <p class="info">게임 별명을 <strong>종 이름 + 번호</strong>로 바꿔 두면(예: 망나뇽 01번 → 별명 <strong>망나뇽01</strong>) 다음 스캔 때 그 개체를 자동으로 고릅니다. 번호는 종마다 따로 셉니다.</p>
    <div class="toolbar">
      <div class="toolbar-left">
        <label class="field search" for="search"><span>종·관리번호·별명으로 찾기</span>
          <input id="search" type="search" autocomplete="off" placeholder="예: 마기라스 02"></label>
        <label class="field sort" for="sort"><span>정렬</span>
          <select id="sort">
            <option value="recent">최근 갱신순</option>
            <option value="cp">CP 높은순</option>
            <option value="iv">IV 높은순</option>
            <option value="level">레벨 높은순</option>
            <option value="hp">최대 HP 높은순</option>
            <option value="species">종 이름순</option>
          </select></label>
      </div>
      <a class="button" href="/api/exports/box.xlsx" download>Excel로 내보내기</a>
    </div>
    <details class="backup">
      <summary>백업과 복원</summary>
      <form id="backup-form">
        <p>박스(개체·이력·관리 번호)와 기준 데이터를 zip 파일 하나로 저장합니다. Excel과 달리 그대로 복원할 수 있습니다.</p>
        <div class="checks">
          <label class="check"><input type="checkbox" name="with_scans"><span>판독 프레임·분석 결과 포함</span></label>
          <label class="check"><input type="checkbox" name="with_videos"><span>원본 영상도 포함 (용량이 큼)</span></label>
        </div>
        <button>백업 만들기</button>
        <p id="backup-status" role="status"></p>
      </form>
      <h3>최근 백업</h3>
      <ul id="backup-list" class="backup-list"></ul>
      <h3>백업에서 복원</h3>
      <label class="field" for="restore-file"><span>백업 zip 선택 (먼저 검사하고, 확인한 뒤에 복원합니다)</span>
        <input id="restore-file" type="file" accept=".zip,application/zip"></label>
      <div id="restore-preview" role="status"></div>
    </details>
    <p id="status" role="status">불러오는 중입니다.</p>
    <div id="pokemon" class="table-wrap"></div>
  </main>
</body>
</html>
