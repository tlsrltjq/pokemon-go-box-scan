<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>맥스배틀 추천 · 포켓몬 GO 박스 스캔</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/common.js" defer></script>
  <script src="/assets/max.js" defer></script>
</head>
<body>
  <div class="appbar"><div class="appbar-inner"><a class="brand" href="/">포켓몬 GO 박스 스캔</a>
    <nav aria-label="주요 화면"><a href="/">스캔</a><a href="/box">내 박스</a><a href="/raids">현재 레이드</a><a href="/raid">레이드 추천</a><a href="/max" aria-current="page">맥스배틀 추천</a></nav>
  </div></div>
  <main>
    <header class="page-head">
      <h1>맥스배틀 추천</h1>
      <p>내 박스의 다이맥스·거다이맥스 개체 중에서 보스에게 가장 많은 피해를 줄 3마리와 출전 순서, 맥스 기술 사용 계획을 계산합니다.</p>
    </header>
    <form id="max-form" class="raid-form">
      <div class="fields">
        <label class="field"><span>보스</span>
          <input name="species" list="species-list" required autocomplete="off" placeholder="예: 리자몽"></label>
        <label class="field"><span>맥스배틀 등급</span><select name="tier"></select></label>
        <label class="field"><span>날씨</span><select name="weather"></select></label>
        <label class="field" id="form-field" hidden><span>보스 모습</span><select name="form"></select></label>
        <label class="field"><span>제한 시간(초)</span><input name="time_limit_s" inputmode="numeric"></label>
        <label class="field"><span>함께하는 트레이너</span><select name="trainers">
          <option value="1">혼자</option><option value="2">2명</option><option value="3">3명</option><option value="4">4명</option>
        </select></label>
        <label class="field"><span>보스 스페셜어택</span><select name="boss_charged"><option value="">모두 계산</option></select></label>
      </div>
      <div class="checks">
        <label class="check"><input type="checkbox" name="orbs" checked><span>15초마다 나오는 에너지 구슬을 모두 줍기</span></label>
      </div>
      <p class="muted">보스 HP·공격 간격·제한 시간은 커뮤니티 자료 기반의 계산용 값입니다. 다른 트레이너의 피해는 넣지 않습니다.</p>
      <datalist id="species-list"></datalist>
      <button>추천 계산</button>
    </form>
    <p id="status" role="status"></p>
    <section id="result" hidden aria-labelledby="result-title">
      <h2 id="result-title">추천 결과</h2>
      <div id="summary" class="card summary"></div>
      <div id="party" class="grid"></div>
      <h3>보스 기술별 결과</h3>
      <table id="scenarios" class="compare"></table>
      <div id="excluded"></div>
      <h3>계산 가정</h3>
      <ul id="assumptions" class="assumptions"></ul>
      <p id="versions" class="muted"></p>
    </section>
  </main>
</body>
</html>
