<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포켓몬 GO 박스 스캔</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/scan.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">POKÉMON GO · 개인 박스</p>
      <h1>박스 스캔</h1>
      <p>화면 녹화에서 프레임을 추출하고, 포켓몬 정보가 읽기 좋게 찍혔는지 확인하세요.</p>
    </header>
    <form id="upload">
      <label for="video">화면 녹화 선택</label>
      <p id="constraints">MOV 또는 MP4 · 최대 200 MiB · 앞부분 72초 분석</p>
      <input id="video" type="file" accept=".mp4,.mov,video/mp4,video/quicktime"
             aria-describedby="constraints" required>
      <button>프레임 추출</button>
    </form>
    <section aria-labelledby="result-title">
      <h2 id="result-title">추출 결과</h2>
      <p id="status" role="status">영상이 준비되면 위에서 선택하세요.</p>
      <div id="frames"></div>
    </section>
  </main>
</body>
</html>
